name: Coverage Test (Ramas de Prueba)

# Solo se activa en ramas que NO sean main
on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches-ignore:
      - main

jobs:
  coverage-test:
    name: Pruebas con Cobertura (tipo JaCoCo)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar tests con cobertura
        run: |
          pytest test_main.py \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html:htmlcov \
            -v

      - name: Verificar umbral mínimo de cobertura (80%)
        run: |
          coverage report --fail-under=80

      - name: Publicar reporte HTML (descargable)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: htmlcov/

      - name: Publicar reporte XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml